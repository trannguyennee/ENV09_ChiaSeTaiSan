# 1. CỔNG CHẠY SERVER BACKEND
server.port=8080

# 2. CẤU HÌNH KẾT NỐI CSDL SQL SERVER
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ENV09_QuanLyTaiSan;encrypt=true;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Tài khoản/mật khẩu CSDL KHÔNG lưu trong mã nguồn. Cung cấp bằng 1 trong 2 cách:
#  (1) Biến môi trường DB_USERNAME, DB_PASSWORD
#  (2) Tạo file application-secret.properties (chép từ application-secret.properties.example), file này đã nằm trong .gitignore
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:application-secret.properties

# 3. CẤU HÌNH HIBERNATE / JPA (GIỮ NGUYÊN 100% CẤU TRÚC 14 BẢNG ĐÃ TẠO)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# GIỮ NGUYÊN TÊN BẢNG VÀ CỘT KHỚP EXACT VỚI CSDL (KHÔNG ĐỔI SANG SNAKE_CASE)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# 4. CẤU HÌNH GIAO DIỆN KIỂM THỬ API SWAGGER UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
